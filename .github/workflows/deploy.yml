name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build server
        working-directory: server
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # Until the EC2 secrets are added (Part C of the guide), skip the deploy
      # instead of failing, so the Actions tab stays green.
      - name: Check deploy secrets
        id: secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "EC2 secrets not set yet - skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to EC2
        if: steps.secrets.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.EC2_APP_DIR }}
            git pull origin main

            cd server
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 startOrReload ecosystem.config.js
            pm2 save

            cd ../client
            npm ci
            npm run build
